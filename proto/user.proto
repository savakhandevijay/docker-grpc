syntax = "proto3";

package demo;

// 1. Force the generated classes into the "Demo" namespace
option php_namespace = "Demo";
option php_metadata_namespace = "Demo\\Users\\Metadata";

// The payload sent by FPM
message UserRequest {
  int32 user_id = 1;
}

// The payload returned by RoadRunner
message UserResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

// The service definition
service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
}