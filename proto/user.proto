syntax = "proto3";

package demo;

// The payload sent by FPM
message UserRequest {
  int32 user_id = 1;
}

// The payload returned by RoadRunner
message UserResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

// The service definition
service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
}